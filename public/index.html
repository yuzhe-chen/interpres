<!doctype html>
<html lang="en">
<head>

  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!--
    Duolingo uses two in-house faces: Feather Bold for headings and DIN Round
    for everything else. Neither is free. Fredoka is the closest open match to
    Feather's chunky rounded letters and Nunito to DIN Round.
  -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="nav" id="nav">
    <div class="nav__inner shell">
      <a class="nav__brand" href="/" data-link aria-label="Interpres, home">
        <img src="/assets/art/logo.svg" alt="" width="40" height="40" />
        <span class="nav__wordmark">interpres</span>
      </a>

      <!-- Duolingo's header: plain uppercase links on the right, grey, the
           current page a shade darker, then the menu. Links that do not fit
           the width move into the menu (public/js/lib/menu.js). -->
      <div class="nav__right">
        <nav class="nav__links" aria-label="Pages">

        </nav>
        <div class="nav__end"></div>
      </div>
    </div>
  </header>

  <main id="main"></main>

  <footer class="footer">
    <div class="shell footer__inner">
      <span class="footer__brand">interpres</span>
      <a class="footer__link" href="https://github.com/yuzhe-chen/interpres" target="_blank" rel="noopener">GitHub</a>
      <p class="footer__legal">© Yuzhe (Julian) Chen 2026</p>
    </div>
  </footer>

  <script data-site="interpres">
// Visit counter: two anonymous +1 counters per site per UTC day (sessions, unique browsers). No cookies, no ids, nothing else sent.
(function () {
  var S = document.currentScript && document.currentScript.getAttribute('data-site');
  try {
    if (!S || navigator.doNotTrack === '1' || navigator.webdriver || /^(localhost|127\.0\.0\.1|)$/.test(location.hostname) || window.top !== window.self) return;
    var D = new Date().toISOString().slice(0, 10), B = 'https://departed-rooms-6e8e1e-default-rtdb.firebaseio.com/visits/' + S + '/' + D + '/';
    var hit = function (k) { try { fetch(B + k + '.json?x-http-method-override=PUT', { method: 'POST', body: '{".sv":{"increment":1}}', keepalive: true, referrerPolicy: 'no-referrer', credentials: 'omit', headers: { 'Content-Type': 'text/plain' } }).catch(function () {}); } catch (e) {} };
    setTimeout(function () {
      try {
        if (!sessionStorage.getItem('visit.' + S)) { sessionStorage.setItem('visit.' + S, D); hit('v'); }
        if (localStorage.getItem('visit.' + S + '.u') !== D) { localStorage.setItem('visit.' + S + '.u', D); hit('u'); }
      } catch (e) {}
    }, 2000);
  } catch (e) {}
})();
  </script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
